name: Build SST Binary

on:
  push:
    branches: [ python-deployment-fixes, build-automation ]
  workflow_dispatch: # Allows manual triggering
    inputs:
      branch:
        description: 'Branch to build from'
        required: true
        default: 'python-deployment-fixes'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch || github.ref }}
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Build SST binary for Linux
      run: |
        go build -ldflags="-s -w" -o sst-linux-amd64 ./cmd/sst
        chmod +x sst-linux-amd64
        ls -la sst-linux-amd64
    
    - name: Upload Linux binary as artifact
      uses: actions/upload-artifact@v3
      with:
        name: sst-linux-amd64-${{ github.sha }}
        path: sst-linux-amd64
        retention-days: 90

  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch || github.ref }}
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Build SST binary for macOS Intel
      run: |
        GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o sst-darwin-amd64 ./cmd/sst
        chmod +x sst-darwin-amd64
        ls -la sst-darwin-amd64
    
    - name: Build SST binary for macOS Apple Silicon
      run: |
        GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o sst-darwin-arm64 ./cmd/sst
        chmod +x sst-darwin-arm64
        ls -la sst-darwin-arm64
    
    - name: Upload macOS Intel binary as artifact
      uses: actions/upload-artifact@v3
      with:
        name: sst-darwin-amd64-${{ github.sha }}
        path: sst-darwin-amd64
        retention-days: 90
        
    - name: Upload macOS Apple Silicon binary as artifact
      uses: actions/upload-artifact@v3
      with:
        name: sst-darwin-arm64-${{ github.sha }}
        path: sst-darwin-arm64
        retention-days: 90

  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch || github.ref }}
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Build SST binary for Windows
      run: |
        go build -ldflags="-s -w" -o sst-windows-amd64.exe ./cmd/sst
        dir sst-windows-amd64.exe
    
    - name: Upload Windows binary as artifact
      uses: actions/upload-artifact@v3
      with:
        name: sst-windows-amd64-${{ github.sha }}
        path: sst-windows-amd64.exe
        retention-days: 90