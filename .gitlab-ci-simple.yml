# Simple GitLab CI/CD with Custom SST Binary
# Copy this content to your project's .gitlab-ci.yml file

variables:
  # Update this URL when you create a GitHub release with your custom binary
  CUSTOM_SST_BINARY_URL: "https://github.com/subssn21/sst/releases/download/YOUR_RELEASE_TAG/sst-linux-amd64"

stages:
  - build
  - deploy

# Build and test with custom SST
build:
  stage: build
  image: node:18-alpine
  before_script:
    # Install dependencies
    - apk add --no-cache python3 py3-pip curl
    - pip install uv
    - npm install -g typescript
    
    # Download your custom SST binary
    - echo "Downloading custom SST binary with Python runtime fixes..."
    - curl -L -o sst "$CUSTOM_SST_BINARY_URL"
    - chmod +x sst
    - ./sst version
  script:
    # Install project dependencies
    - npm install
    
    # Build with your custom SST binary (this should now work with legacy Python structures)
    - ./sst build --stage $CI_COMMIT_REF_SLUG
  artifacts:
    paths:
      - sst  # Cache the binary for deploy stage
      - .sst/  # Cache SST build artifacts
    expire_in: 1 hour

# Deploy with custom SST
deploy:
  stage: deploy
  image: node:18-alpine
  dependencies:
    - build
  before_script:
    - apk add --no-cache python3 py3-pip
    - pip install uv
    - chmod +x sst
  script:
    # Set up AWS credentials (configure these in GitLab CI/CD variables)
    - export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
    - export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
    - export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-us-east-1}"
    
    # Deploy with custom binary
    - ./sst deploy --stage $CI_COMMIT_REF_SLUG
  environment:
    name: $CI_COMMIT_REF_SLUG
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "staging"
    - when: manual